<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>营养健康行业资讯封面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1800px; height: 766px; overflow: hidden; }
  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', Arial, Helvetica, sans-serif;
  }
  .cover {
    position: relative;
    width: 1800px;
    height: 766px;
    background: linear-gradient(180deg, #FFFFFF 0%, #DCEAF8 100%);
  }
  .accent {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 10px;
    background: #72BF44;
  }
  .rail {
    position: absolute;
    left: 0; top: 0; bottom: 10px;
    width: 14px;
    background: linear-gradient(180deg, #2F6CAE 0%, #173B66 100%);
  }
  .content {
    position: absolute;
    left: 96px; right: 96px; top: 0;
    height: 756px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo-row { position: absolute; top: 56px; left: 0; height: 88px; }
  .logo-row img { height: 88px; }
  .brand {
    font-size: 38px;
    letter-spacing: 0.35em;
    color: #2F6CAE;
    font-weight: 600;
  }
  .series {
    margin-top: 14px;
    font-size: 84px;
    font-weight: 700;
    color: #173B66;
    line-height: 1.2;
  }
  .title {
    margin-top: 26px;
    font-size: 52px;
    font-weight: 700;
    color: #2B3545;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .meta {
    margin-top: 34px;
    font-size: 34px;
    color: #718096;
    letter-spacing: 0.06em;
  }
  .meta .dot { color: #72BF44; font-weight: 700; }
</style>
</head>
<body>
  <div class="cover">
    <div class="rail"></div>
    <div class="content">
      <div class="logo-row">{{LOGO_IMG}}</div>
      {{BRAND_BLOCK}}
      <div class="series">营养健康行业资讯</div>
      <div class="title">{{ARTICLE_TITLE}}</div>
      <div class="meta">政策 <span class="dot">·</span> 品牌 <span class="dot">·</span> 展会&nbsp;&nbsp;｜&nbsp;&nbsp;{{DATE_TEXT}}</div>
    </div>
    <div class="accent"></div>
  </div>
</body>
</html>
