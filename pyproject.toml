[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrition-signal-radar"
version = "0.1.0"
description = "Local topic and research workbench for nutrition and functional-food industry signals."
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nutrition-radar = "nutrition_signal_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nutrition_signal_radar = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
